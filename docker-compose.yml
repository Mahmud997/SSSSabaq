services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ustaz}
      POSTGRES_USER: ${POSTGRES_USER:-ustaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ustaz} -d ${POSTGRES_DB:-ustaz}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8000"
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
